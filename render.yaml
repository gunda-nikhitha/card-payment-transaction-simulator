# ==============================================================
# Render Blueprint Configuration (render.yaml)
# Card Payment Transaction Simulator Deployment Specification
# ==============================================================

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: cpts-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
        # Enter your remote MySQL connection string:
        # e.g., jdbc:mysql://<host>:<port>/<database>?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: AI_ENABLED
        value: "false"
      - key: AI_API_KEY
        sync: false

  # 2. React Frontend Static Site
  - type: web
    name: cpts-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: cpts-backend
          type: web
          property: host
